services:
  postgres:
    image: postgres:16-alpine
    container_name: culinary-blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: culinary_blog
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - culinary_blog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d culinary_blog"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: culinary-blog-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    # Community-maintained MinIO image; upstream no longer publishes the CE image.
    image: soldevelo/minio:2026.7.17
    container_name: culinary-blog-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${Minio__AccessKey:-minioadmin}
      MINIO_ROOT_PASSWORD: ${Minio__SecretKey:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${Minio__Bucket:-culinary-blog}
    ports:
      - "9000:9000"
    volumes:
      - culinary_blog_minio_data:/bitnami/minio/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: culinary-blog-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=culinary_blog;Username=admin;Password=admin;SSL Mode=Disable
      Minio__Endpoint: http://minio:9000
      Minio__PublicEndpoint: ${Minio__PublicEndpoint:-http://localhost:9000}
      Minio__AccessKey: ${Minio__AccessKey:-minioadmin}
      Minio__SecretKey: ${Minio__SecretKey:-minioadmin}
      Minio__Bucket: ${Minio__Bucket:-culinary-blog}
      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__UseSsl: ${SMTP_USE_SSL:-false}
      Smtp__UserName: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-no-reply@culinary.local}
      Smtp__FromName: ${SMTP_FROM_NAME:-Culinary Blog}
      WelcomeEmail__ApplicationUrl: ${WELCOME_EMAIL_APPLICATION_URL:-http://localhost:3000}
    ports:
      - "5080:8080"
    volumes:
      - culinary_blog_uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_started

volumes:
  culinary_blog_pgdata:
  culinary_blog_uploads:
  culinary_blog_minio_data:
